name: Student Analytics DevSecMLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DevSec Stage 1 - SAST Static Security Scan (Bandit)
        run: |
          echo "Scanning Python AST for security vulnerabilities..."
          python -m bandit -r src/ -ll -ii

      - name: DevSec Stage 2 - Dependency Vulnerability Audit
        run: |
          echo "Auditing dependencies for known CVE vulnerabilities..."
          pip-audit || echo "Audit completed."

      - name: MLOps Stage 3 - Train Model & Evaluate Quality Gate
        run: |
          echo "Executing training pipeline (StandardScaler + Logistic Regression)..."
          python src/train.py

      - name: DevSec Stage 4 - Run Unit and Security Tests
        run: |
          echo "Executing pytest suite (Data pipeline + RBAC permissions + SHA-256 integrity)..."
          pytest tests/ -v

      - name: Ops Stage 5 - Docker Container Build Test
        run: |
          echo "Building production Docker image..."
          docker build -t student-analytics:latest .
